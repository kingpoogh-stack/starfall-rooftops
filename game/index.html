<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARFALL ROOFTOPS — a lighthouse keeper's cat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="frame">
    <header class="masthead">
      <h1>STARFALL ROOFTOPS</h1>
      <p class="tagline">A lighthouse keeper's cat, leaping rooftops at dusk for lost stars.</p>
    </header>
    <div class="stage">
      <canvas id="game" width="960" height="540" aria-label="Starfall Rooftops game canvas"></canvas>
    </div>
    <p class="hint">One button only — <strong>SPACE</strong> / click / tap &nbsp;·&nbsp; press to jump, hold for a higher leap, release to fall &nbsp;·&nbsp; 60 seconds, score attack</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
